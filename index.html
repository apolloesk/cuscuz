<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Zombie 8K Ultra Supreme - Spawn Dinâmico</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:#111; }
canvas { display:block; }
#powerUpMenu {
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  background: rgba(0,0,0,0.95);
  color:white;
  padding:20px;
  border-radius:12px;
  display:none;
  text-align:center;
  font-family: sans-serif;
}
#powerUpMenu button{
  margin:6px;
  padding:10px 16px;
  cursor:pointer;
  border-radius:6px;
  border:none;
  background-color:limegreen;
  font-weight:bold;
  color:black;
  font-size:16px;
  transition: transform 0.2s;
}
#powerUpMenu button:hover{
  transform: scale(1.3);
  background-color:#00ff00;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="powerUpMenu">
<p><strong>Escolha seu Power-Up ULTRA 8K!</strong></p>
<button onclick="choosePowerUp('speed')">Velocidade +1</button>
<button onclick="choosePowerUp('health')">Vida Máx +20</button>
<button onclick="choosePowerUp('damage')">Dano +5</button>
<button onclick="choosePowerUp('regen')">Regeneração +1</button>
<button onclick="choosePowerUp('bullet')">Tiro 5× Dano (1 min)</button>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const powerUpMenu=document.getElementById('powerUpMenu');

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// --------------------
// Jogador
// --------------------
let player={
  x:0, y:0,
  width:60, height:60,
  speed:6,
  color:'#00ff99',
  health:120, maxHealth:120,
  canTakeDamage:true,
  damageCooldown:0,
  damage:12,
  regen:0,
  bullets:[],
  baseDamage:12,
  isBulletBoost:false,
  bulletBoostTimeout:null
};

// --------------------
// Zumbis e Spawn
// --------------------
let zombies=[];
const zombieCount=30;
const zombieSize=50;
const spawnRadius = 800; // distância máxima do jogador para spawn

function spawnZombieNearPlayer(){
  zombies.push({
    x:player.x + Math.random()*spawnRadius*2 - spawnRadius,
    y:player.y + Math.random()*spawnRadius*2 - spawnRadius,
    width:zombieSize,
    height:zombieSize,
    speed:1+Math.random()*1.5,
    health:50+Math.random()*50,
    alive:true,
    color:'#ff5555'
  });
}

function spawnInitialZombies(){
  zombies=[];
  for(let i=0;i<zombieCount;i++){
    spawnZombieNearPlayer();
  }
}
spawnInitialZombies();

// --------------------
// Blocos verdes mortais
// --------------------
let deadlyBlocks=[
  {x:400,y:300,width:70,height:70,color:'#00ff00'},
  {x:-600,y:200,width:70,height:70,color:'#00ff00'}
];

// --------------------
// Controle de teclas
// --------------------
let keys={};
window.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// --------------------
// Pontos e Power-Ups
// --------------------
let points=0;
let nextPowerUpThreshold=100;
let activePowerUps=[];

function choosePowerUp(type){
  switch(type){
    case 'speed': player.speed+=1; break;
    case 'health': player.maxHealth+=20; player.health=player.maxHealth; break;
    case 'damage': player.damage+=5; break;
    case 'regen': player.regen+=1; break;
    case 'bullet':
      if(player.isBulletBoost) clearTimeout(player.bulletBoostTimeout);
      player.damage *= 5;
      player.isBulletBoost=true;
      player.bulletBoostTimeout = setTimeout(()=>{
        player.damage = player.baseDamage;
        player.isBulletBoost=false;
      },60000); // 1 minuto
      break;
  }
  activePowerUps.push(type);
  powerUpMenu.style.display='none';
  nextPowerUpThreshold+=100;
}

// --------------------
// Balas
// --------------------
let bullets=[];
canvas.addEventListener('click', e=>{
  const rect=canvas.getBoundingClientRect();
  const mouseX=e.clientX-rect.left;
  const mouseY=e.clientY-rect.top;
  const dx=mouseX-canvas.width/2;
  const dy=mouseY-canvas.height/2;
  const angle=Math.atan2(dy,dx);
  bullets.push({
    x:player.x+player.width/2,
    y:player.y+player.height/2,
    vx:Math.cos(angle)*14,
    vy:Math.sin(angle)*14,
    radius:10,
    damage:player.damage
  });
});

// --------------------
// Atualização
// --------------------
function update(){
  // Movimento WASD
  let moveX=0, moveY=0;
  if(keys['w']) moveY-=player.speed;
  if(keys['s']) moveY+=player.speed;
  if(keys['a']) moveX-=player.speed;
  if(keys['d']) moveX+=player.speed;
  player.x+=moveX;
  player.y+=moveY;

  // Cooldown de dano
  if(!player.canTakeDamage){
    player.damageCooldown--;
    if(player.damageCooldown<=0) player.canTakeDamage=true;
  }

  // Regeneração
  if(player.regen>0 && player.health<player.maxHealth){
    player.health+=player.regen*0.3;
    if(player.health>player.maxHealth) player.health=player.maxHealth;
  }

  // Zumbis
  for(let i=0;i<zombies.length;i++){
    let z=zombies[i];
    if(!z.alive) continue;
    let dx=player.x-z.x;
    let dy=player.y-z.y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>0){
      z.x+=(dx/dist)*z.speed;
      z.y+=(dy/dist)*z.speed;
    }
    if(dist<(player.width+z.width)/2 && player.canTakeDamage){
      player.health-=player.damage;
      player.canTakeDamage=false;
      player.damageCooldown=25;
      if(player.health<=0){ alert('Você morreu! 💀'); resetGame(); }
      else points+=10;
    }
  }

  // Evitar empilhamento zumbis
  for(let i=0;i<zombies.length;i++){
    for(let j=i+1;j<zombies.length;j++){
      let z1=zombies[i], z2=zombies[j];
      if(!z1.alive||!z2.alive) continue;
      let dx=z1.x-z2.x, dy=z1.y-z2.y;
      let dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<zombieSize){
        let overlap=zombieSize-dist;
        let angle=Math.atan2(dy,dx);
        z1.x+=Math.cos(angle)*(overlap/2);
        z1.y+=Math.sin(angle)*(overlap/2);
        z2.x-=Math.cos(angle)*(overlap/2);
        z2.y-=Math.sin(angle)*(overlap/2);
      }
    }
  }

  // Colisão blocos verdes
  deadlyBlocks.forEach(b=>{
    if(player.x<b.x+b.width && player.x+player.width>b.x &&
       player.y<b.y+b.height && player.y+player.height>b.y){
      alert('Você morreu! 💀');
      resetGame();
    }
  });

  // Power-Up
  if(points>=nextPowerUpThreshold) powerUpMenu.style.display='block';

  // Atualizar balas
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];
    b.x+=b.vx; b.y+=b.vy;
    let hit=false;
    for(let j=0;j<zombies.length;j++){
      let z=zombies[j];
      if(!z.alive) continue;
      if(b.x>z.x && b.x<z.x+z.width && b.y>z.y && b.y<z.y+z.height){
        z.health-=b.damage;
        hit=true;
        if(z.health<=0){
          z.alive=false;
          points+=20;
          // Spawnar novo zumbi no spawn
          spawnZombieNearPlayer();
        }
        break;
      }
    }
    if(hit || b.x<-3000 || b.x>3000 || b.y<-3000 || b.y>3000) bullets.splice(i,1);
  }
}

// --------------------
// Reset
// --------------------
function resetGame(){
  player.x=0; player.y=0; player.health=player.maxHealth;
  points=0; nextPowerUpThreshold=100; activePowerUps=[];
  bullets=[];
  player.damage = player.baseDamage;
  player.isBulletBoost = false;
  if(player.bulletBoostTimeout) clearTimeout(player.bulletBoostTimeout);
  spawnInitialZombies();
}

// --------------------
// Desenho
// --------------------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX=canvas.width/2-player.x-player.width/2;
  const camY=canvas.height/2-player.y-player.height/2;

  // Fundo
  ctx.fillStyle = '#222';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Zumbis
  zombies.forEach(z=>{
    if(!z.alive) return;
    ctx.fillStyle=z.color;
    ctx.shadowColor='black';
    ctx.shadowBlur=20;
    ctx.fillRect(z.x+camX,z.y+camY,z.width,z.height);
  });

  // Blocos verdes
  deadlyBlocks.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.shadowColor='lime';
    ctx.shadowBlur=25;
    ctx.fillRect(b.x+camX,b.y+camY,b.width,b.height);
  });

  // Jogador
  ctx.fillStyle=player.color;
  ctx.shadowColor='cyan';
  ctx.shadowBlur=30;
  ctx.fillRect(canvas.width/2-player.width/2, canvas.height/2-player.height/2, player.width, player.height);
  ctx.shadowBlur=0;

  // Balas
  bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x+camX,b.y+camY,b.radius,0,Math.PI*2);
    ctx.fillStyle='yellow';
    ctx.shadowColor='yellow';
    ctx.shadowBlur=20;
    ctx.fill();
    ctx.shadowBlur=0;
  });

  // HUD
  ctx.fillStyle='white';
  ctx.font='24px Arial';
  ctx.fillText('Vida: '+Math.round(player.health),20,40);
  ctx.fillText('Pontos: '+points,20,70);
  ctx.fillText('Próximo Power-Up: '+nextPowerUpThreshold,20,100);
  ctx.fillText('Power-Ups: '+activePowerUps.join(', '),20,130);

  // Barra de vida
  ctx.fillStyle='red';
  ctx.fillRect(20,150,400,30);
  ctx.fillStyle='lime';
  ctx.fillRect(20,150,400*(player.health/player.maxHealth),30);
  ctx.strokeStyle='white';
  ctx.strokeRect(20,150,400,30);
}

// --------------------
// Loop principal
function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
